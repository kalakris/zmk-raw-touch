# Right half = peripheral, the board's default.

# Over a BLE split link, ZMK relays each input event with its own GATT
# notification, sent from the split service's work queue. A stamped pad
# frame is four events (X, Y, stamp, Z); 8 transmit buffers let one 10 ms
# frame go out in a single connection event instead of waiting for the
# next one with the stock 3. Harmless on a wired split.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
